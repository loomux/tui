# The release run (R3, LOOM-278; the design in loomux/server,
# docs/design/tui-client-design.md, "Releases and versioning" and
# "Packaging"; how it works and how to cut a milestone: docs/release.md).
# It follows loomux/server's .github/workflows/image.yml (LOOM-129).
#
# Two things start it, and nothing else (TestOnlyMainAndTagsPublish):
#
#   a merge to main   the next patch pre-release: the version job reserves
#                     it by creating its tag, and this same run builds and
#                     releases it (a tag the run's GITHUB_TOKEN creates
#                     starts no other workflow)
#   a pushed v* tag   a milestone a person cuts (0.1.0, each MINOR, an
#                     -rc, 1.0.0), with its CHANGELOG.md section
#
# A pull request or another branch never publishes anything (ci.yml
# checks those, and its TestBuild runs the same build script).
#
#   version  the version this run releases: reserved (a merge) or checked
#            (a tag); none before the first milestone, or for a merge a
#            newer release already covers, and then nothing else runs
#   build    vet and race tests on the commit, then deploy/build.sh:
#            CGO-free binaries for linux and darwin on amd64 and arm64, the
#            version stamped with -ldflags -X, and SHA256SUMS; a build
#            provenance attestation for each binary
#   release  the GitHub pre-release (every 0.y.z and -pre version is one,
#            never "latest") with the binaries and SHA256SUMS, created as a
#            draft and published once every file is up
#
# Actions are pinned by commit, with the release in a comment.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

# No concurrency group for the run, as in the server: a group keeps one
# pending run and cancels the others, which there dropped the middle of
# three quick merges with no version at all (LOOM-129). Racing merges
# each reserve their own version instead, and only the release job
# below waits, per version.

permissions: {}

env:
  # The toolchain go.mod names, never a newer one downloaded on the fly,
  # and go.mod alone, never a go.work.
  GOTOOLCHAIN: local
  GOWORK: "off"

jobs:
  # The version, settled before anything is built. A merge reserves the
  # next patch: deploy/release.sh reserve creates its tag on the merge
  # commit through the API, which refuses a tag that exists, so racing
  # merges each get their own; a re-run keeps the version the commit
  # already has. v* tags are immutable (a ruleset), so a run that fails
  # after this burns the number unless it is re-run: SemVer allows the
  # gap, and no version is reused. A pushed tag is checked: v + SemVer,
  # on main, with its CHANGELOG.md section.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags and main: the line continues from the highest tag,
          # and a released commit must be on main.
          fetch-depth: 0
          persist-credentials: false
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="$(deploy/release.sh check "${GITHUB_REF_NAME}")"
          elif [ "${GITHUB_REF}" = refs/heads/main ]; then
            version="$(deploy/release.sh reserve "${GITHUB_SHA}" patch)"
            # reserve never makes an X.Y.0: one here is a milestone a
            # person tagged the commit with before this run reserved.
            # It is held to the tag's check here too.
            case "${version}" in
            *.0) deploy/release.sh check "v${version}" >/dev/null ;;
            esac
          else
            echo "::error::${GITHUB_REF} is neither main nor a v* tag"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Version: ${version:-none}" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A release builds from nothing a cache could have changed.
          cache: false

      - run: go vet ./...

      # The commit passed ci.yml as a pull request (and runs it again on
      # main); this is the same run on the toolchain that builds the
      # release.
      - run: go test -race ./...

      - name: Build
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: sh deploy/build.sh "${VERSION}" dist

      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/loomux-*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  release:
    needs: [version, build]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # One run at a time publishes a version: a milestone tagged before the
    # merge's own run reserved is released by both runs, and the second
    # finds it published. Per version, so no merge waits on another's.
    concurrency:
      group: release-v${{ needs.version.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history and tags, for a patch's notes.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          tag="v${VERSION}"
          (cd dist && sha256sum -c SHA256SUMS)
          # A published release is done. A draft is what an attempt that
          # failed part-way left: start it again.
          if draft="$(gh release view "${tag}" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "${draft}" = false ]; then echo "${tag} is already released."; exit 0; fi
            gh release delete "${tag}" --yes
          fi
          # A milestone's notes are its CHANGELOG section; a patch's, the
          # commits merged to main since the previous release (each a pull
          # request, "(#N)"): usually the one merge, and also any older
          # merge whose own run released nothing.
          if ! deploy/release.sh notes "${VERSION}" > notes.md 2>/dev/null; then
            deploy/release.sh log "${GITHUB_SHA}" > notes.md
          fi
          {
            printf '\nServer pin: `%s`.\n\n' "$(sed -n 's/^const ServerPin = "\(.*\)"$/\1/p' internal/version/serverpin.go)"
            printf 'Check a download: `sha256sum -c --ignore-missing SHA256SUMS` and\n'
            printf '`gh attestation verify loomux-%s-<os>-<arch> -R %s`.\n' "${VERSION}" "${GITHUB_REPOSITORY}"
          } >> notes.md
          pre=""
          if deploy/release.sh prerelease "${VERSION}"; then pre="--prerelease"; fi
          gh release create "${tag}" --verify-tag --draft ${pre} --latest=false \
            --title "loomux ${VERSION}" --notes-file notes.md dist/*
          gh release edit "${tag}" --draft=false
          echo "Released \`${tag}\`" >> "$GITHUB_STEP_SUMMARY"
